<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Advanced 3D Currency Converter with real-time exchange rates. Convert any currency instantly with a futuristic interface."
    />
    <title>3D Currency Converter - Futuristic Financial Tool</title>
    <link
      rel="icon"
      href="https://cdn-icons-png.flaticon.com/512/1086/1086741.png"
      type="image/x-icon"
    />
    <link href="style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Background visual shapes -->
    <div class="bg-visuals">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <div class="tilt-wrapper">
      <main class="container" id="card">
        <h2>Currency Converter</h2>
        <form id="converter-form">
          <div class="amount">
            <p>Amount To Convert</p>
            <input
              id="amount-input"
              value="1"
              type="number"
              min="1"
              step="any"
              placeholder="0.00"
            />
          </div>

          <div class="dropdown">
            <div class="dropdown-item from">
              <p>From</p>
              <div class="select-container">
                <img
                  src="https://flagsapi.com/US/flat/64.png"
                  alt="From country flag"
                />
                <select name="from" id="from-currency"></select>
              </div>
            </div>

            <div class="exchange-icon" id="swap-btn" title="Swap currencies">
              <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </div>

            <div class="dropdown-item to">
              <p>To</p>
              <div class="select-container">
                <img
                  src="https://flagsapi.com/IN/flat/64.png"
                  alt="To country flag"
                />
                <select name="to" id="to-currency"></select>
              </div>
            </div>
          </div>

          <div class="msg" id="exchange-message">Ready to convert</div>

          <button type="submit" id="get-rate-btn">Get Exchange Rate</button>
        </form>
      </main>
    </div>

    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
